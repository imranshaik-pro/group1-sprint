name: Study workspace checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Run browser verification
        run: |
          python3 -m http.server 8080 --directory app > /tmp/group1-server.log 2>&1 &
          node tests/browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-qa
          path: qa-artifacts/
