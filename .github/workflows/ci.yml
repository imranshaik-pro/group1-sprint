name: Study workspace checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Ensure PDF page renderer
        run: |
          if ! command -v pdftoppm >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - run: npm run build
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright@1.58.2 esbuild@0.28.0 react@19.2.6 react-dom@19.2.6 lucide-react@1.31.0 typescript@5.9.3
      - name: Verify website modules, typed event contracts and release inventory
        run: |
          cp -Rn app/. studio/public/sprint/
          mkdir -p studio/docs
          cp -Rn docs/. studio/docs/
          cp -R app/pdf-scans studio/public/pdf-scans
          node --test studio/tests/*.test.mjs
          (cd studio && node --experimental-strip-types --test tests/*.test.ts)
          node scripts/release-check.mjs
      - run: npx playwright install --with-deps chromium
      - name: Run browser verification
        run: |
          python3 -m http.server 8080 --directory app > /tmp/group1-server.log 2>&1 &
          node tests/browser-qa.cjs
      - name: Verify actual website and app topic clicks
        run: |
          node scripts/build-website-qa.mjs
          python3 -m http.server 8081 --directory .qa-website > /tmp/group1-website-qa.log 2>&1 &
          node tests/topic-navigation-browser.cjs
          node tests/product-foundation-browser.cjs
          node tests/offline-documents-browser.cjs
          node tests/dashboard-visual-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-qa
          path: qa-artifacts/
